name: discovery

# Every 2 hours, the scheduled run discovers and scores (no browser install, to stay
# inside the free Actions minutes). Manual runs from the Actions tab can also run the
# browser inspection: choose mode "full" or "inspect".
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [full, scan, discover, score, inspect]
        default: full
      inspect_limit:
        description: "Max pending applications to inspect (read-only Playwright)"
        required: false
        default: "5"

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

# Never run two pipelines at once. Upserts are idempotent either way.
concurrency:
  group: internshippilot-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    name: discover, score, inspect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ inputs.mode || 'scan' }}
      INSPECT_LIMIT: ${{ inputs.inspect_limit || '5' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
      GEMINI_DAILY_CALL_CAP: "40"
      GEMINI_RUN_CALL_CAP: "25"
      AI_ENABLED: "true"
      REQUEST_MIN_INTERVAL_SECONDS: "2"
      SCRAPER_CONTACT_URL: ${{ vars.SCRAPER_CONTACT_URL }}
      SCRAPER_CONTACT_EMAIL: ${{ vars.SCRAPER_CONTACT_EMAIL }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements*.txt

      - name: Install core dependencies and test tools
        working-directory: pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Test suite (must pass before any network work)
        working-directory: pipeline
        run: python -m pytest -q

      - name: Install Playwright Chromium (inspection modes only)
        if: ${{ env.MODE == 'full' || env.MODE == 'inspect' }}
        working-directory: pipeline
        run: |
          pip install -r requirements-inspect.txt
          python -m playwright install --with-deps chromium

      - name: Run pipeline
        working-directory: pipeline
        run: python -m ipilot pipeline --mode "$MODE" --inspect-limit "$INSPECT_LIMIT"
